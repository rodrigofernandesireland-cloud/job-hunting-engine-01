# Copy this file to config.yaml. config.yaml is local and ignored by git.

candidate:
  name: "Your Name"
  email: "you@example.com"
  location: "Dublin, Ireland"
  linkedin_url: "https://linkedin.com/in/your-profile"
  portfolio_url: "https://github.com/your-user"
  cv_path: "data/cv.pdf"
  pitch: "Junior software developer looking for a remote-friendly role in Europe."

search:
  job_titles:
    - "junior developer"
    - "junior software engineer"
    - "graduate developer"
    - "entry level developer"
  exclude_keywords:
    - "senior"
    - "lead"
    - "staff"
    - "principal"
  remote_only: true
  target_regions:
    - "Ireland"
    - "United Kingdom"
    - "Germany"
    - "Netherlands"
    - "Remote Europe"
  sources:
    remoteok: true
    arbeitnow: true
    weworkremotely: false
    adzuna: false

outreach:
  daily_send_limit: 10
  follow_up_after_days: 5
  max_follow_ups: 1
  send_window_hours: [9, 18]
  subject_line: "Junior Developer — {candidate_name}, based in {candidate_location}"
  signoff: "Best,\n{candidate_name}\n{candidate_linkedin}"

contact_finding:
  preferred_titles:
    - "recruiter"
    - "talent acquisition"
    - "hiring manager"
    - "engineering manager"
    - "founder"

claude:
  model: "claude-sonnet-4-6"
  personalization_temperature: 0.4
